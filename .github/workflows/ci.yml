name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Alya Compiler
        uses: alya-lang/setup-alya@v1
        with:
          version: 'latest'

      - name: Verify alyac installation
        run: |
          alyac --version

      - name: Check code formatting
        run: |
          alyac fmt . --check

      - name: Check package manifest
        run: |
          alyac pkg list

      - name: Install dependencies
        run: |
          alyac install

      - name: Run package test suite
        run: |
          alyac test

